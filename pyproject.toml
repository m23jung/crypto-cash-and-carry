[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funding"
version = "0.1.0"
description = "Crypto cash-and-carry: capital efficiency in the spot-perpetual basis trade"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "requests>=2.31", "markdown>=3.5", "matplotlib>=3.8", "scipy>=1.11", "tabulate>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = ["funding"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
